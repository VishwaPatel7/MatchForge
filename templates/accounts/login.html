{% extends 'base.html' %}

{% block public_content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5 col-lg-4">
        <div class="mf-card p-4">
            <div class="text-center mb-4">
                <i class="bi bi-cpu-fill text-primary display-5"></i>
                <h4 class="fw-bold mt-2">Welcome Back</h4>
                <p class="text-muted small">Sign in to your MatchForge account</p>
            </div>

            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>
            </form>

            <div class="text-center mt-4 text-muted small">
                Don't have an account? <a href="{% url 'register' %}" class="text-decoration-none fw-semibold">Register here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
