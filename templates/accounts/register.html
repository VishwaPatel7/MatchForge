{% extends 'base.html' %}

{% block public_content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="mf-card p-4">
            <div class="text-center mb-4">
                <i class="bi bi-cpu-fill text-primary display-5"></i>
                <h4 class="fw-bold mt-2">Create Your Account</h4>
                <p class="text-muted small">Start discovering roles that actually fit your profile</p>
            </div>

            <form method="POST" action="{% url 'register' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Full Name</label>
                    <input type="text" name="full_name" class="form-control" placeholder="e.g. Alex Sharma" required autofocus>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label small fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Username" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label small fw-semibold">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Current City</label>
                    <input type="text" name="location" class="form-control" placeholder="e.g. Bangalore, Hyderabad, Remote">
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Create a secure password (min. 6 characters)" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Register Free</button>
            </form>

            <div class="text-center mt-4 text-muted small">
                Already registered? <a href="{% url 'login' %}" class="text-decoration-none fw-semibold">Sign in</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
