{% extends 'base.html' %}

{% block page_title %}Candidate Profile{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="mf-card p-4">
            <h6 class="fw-bold mb-3"><i class="bi bi-person-circle text-primary me-2"></i>Profile Information</h6>
            <form method="POST" action="{% url 'profile' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Headline</label>
                    <input type="text" name="headline" class="form-control" value="{{ profile.headline }}" placeholder="e.g. Backend Software Engineer Intern | Python &amp; Django">
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Professional Bio & Career Goals</label>
                    <textarea name="bio" class="form-control" rows="3" placeholder="Briefly describe your career objectives and focus areas...">{{ profile.bio }}</textarea>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label small fw-semibold">Current Location</label>
                        <input type="text" name="current_location" class="form-control" value="{{ profile.current_location }}" placeholder="e.g. Bangalore, Hyderabad">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label small fw-semibold">Total Experience (Months)</label>
                        <input type="number" name="experience_months" class="form-control" value="{{ profile.experience_months }}" min="0" max="120">
                    </div>
                </div>
                <div class="form-check form-switch mb-4">
                    <input class="form-check-input" type="checkbox" name="willing_to_relocate" id="relocateSwitch" {% if profile.willing_to_relocate %}checked{% endif %}>
                    <label class="form-check-label small fw-semibold" for="relocateSwitch">Open to relocation for the right opportunity</label>
                </div>
                <button type="submit" class="btn btn-primary fw-semibold px-4">Save Changes</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
